name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Syntax-check browser, API and build scripts
        run: |
          for f in js/*.js api/*.js shared/*.js theme.js analytics.js config.js scripts/build.mjs; do
            node --check "$f"
          done

      - name: Site build (demo-mode config, no secrets needed)
        run: node scripts/build.mjs
