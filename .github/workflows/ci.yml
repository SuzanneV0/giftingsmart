name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Syntax-check browser, API and build scripts
        run: |
          for f in js/*.js api/*.js shared/*.js theme.js analytics.js config.js scripts/build.mjs; do
            node --check "$f"
          done

      - name: Site build (demo-mode config, no secrets needed)
        run: node scripts/build.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo mode)
        run: npm run test:e2e

      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
